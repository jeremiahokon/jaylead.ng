<!doctype html>
<!--
  The 1200x630 share card for WhatsApp, Instagram bios and search, rendered
  by scripts/render-og.sh through headless Chrome with the site's real fonts
  and logo, then written to src/app/opengraph-image.jpg and twitter-image.jpg.
-->
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Slab;
        src: url('../src/fonts/bespoke-slab.woff2');
      }
      @font-face {
        font-family: Slab;
        font-style: italic;
        src: url('../src/fonts/bespoke-slab-italic.woff2');
      }
      @font-face {
        font-family: Lexend;
        src: url('../src/fonts/lexend.woff2');
        font-weight: 400 700;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #f1ecdf;
        color: #0d3924;
        font-family: Lexend;
        display: grid;
        grid-template-columns: 1fr 430px;
        overflow: hidden;
      }
      .copy {
        padding: 56px 40px 52px 64px;
        display: flex;
        flex-direction: column;
      }
      .logo {
        height: 46px;
        width: auto;
        align-self: flex-start;
      }
      h1 {
        font-family: Slab;
        font-weight: 700;
        font-size: 82px;
        line-height: 0.96;
        letter-spacing: -0.03em;
        margin-top: auto;
      }
      h1 em {
        color: #a63d17;
      }
      .meta {
        margin-top: 30px;
        font-size: 17px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
        opacity: 0.85;
      }
      .img {
        position: relative;
        background: url('../public/images/aerial-fields.webp') center / cover;
      }
      .img::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(13, 57, 36, 0.25),
          rgba(13, 57, 36, 0)
        );
      }
      .tag {
        position: absolute;
        left: 28px;
        bottom: 28px;
        z-index: 1;
        color: #f1ecdf;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <img class="logo" src="../public/brand/jaylead-logo.svg" alt="" />
      <h1>Own titled farmland. <em>We farm it.</em></h1>
      <p class="meta">Palm Grove Estate · Osun State · From ₦4,000,000</p>
    </div>
    <div class="img"><span class="tag">CAC RC 9492571</span></div>
  </body>
</html>
